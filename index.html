<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NACIO - Uskoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(ellipse at top, rgba(0,46,125,0.55), rgba(0,15,36,1) 65%);
            color: rgba(203,213,225,0.95);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { text-align: center; max-width: 600px; }
        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: clamp(54px, 12vw, 96px);
            letter-spacing: 0.12em;
            color: #FFD700;
            text-shadow: 0 0 35px rgba(255,215,0,0.4);
            text-transform: uppercase;
            margin-bottom: 5px;
            animation: pulseGlow 3s ease-in-out infinite;
        }
        .tagline {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: clamp(14px, 3vw, 18px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(203,213,225,0.6);
            margin-bottom: 40px;
        }
        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 9999px;
            background: rgba(255,215,0,0.08);
            border: 1px solid rgba(255,215,0,0.3);
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.06em;
            color: #FFD700;
            text-transform: uppercase;
        }
        .pulse-dot {
            width: 8px; height: 8px;
            background-color: #FFD700;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 8px #FFD700; }
        }
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 35px rgba(255,215,0,0.3); }
            50% { text-shadow: 0 0 50px rgba(255,215,0,0.5); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">NACIO</h1>
        <p class="tagline">Gdje smo, nacijo?</p>
        <div class="badge-status">
            <span class="pulse-dot"></span>
            Sistem se priprema za lansiranje
        </div>
    </div>
</body>
</html>
