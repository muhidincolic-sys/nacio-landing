<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NACIO - Gdje smo, nacijo?</title>
    <!-- Google Fonts: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bosnia-blue: #002E7D;
            --bosnia-yellow: #FFD700;
            --deep-navy-1: #001026;
            --text-body: rgba(203,213,225,0.95);
            --glass-navy: rgba(0,15,36,0.55);
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at top, rgba(0,46,125,0.55), rgba(0,15,36,1) 65%);
            color: var(--text-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero {
            text-align: center;
            padding: 120px 20px 60px;
            max-width: 800px;
        }

        .hero-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: clamp(48px, 10vw, 90px);
            letter-spacing: 0.05em;
            color: var(--bosnia-yellow);
            text-shadow: 0 0 30px rgba(255,215,0,0.35);
            margin: 0;
            text-transform: uppercase;
        }

        .hero-tagline {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 20px;
            color: rgba(203,213,225,0.85);
            margin-top: 10px;
            margin-bottom: 40px;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1100px;
            padding-bottom: 100px;
        }

        .card-glass {
            background: linear-gradient(160deg, rgba(0,15,36,0.92) 0%, rgba(0,31,63,0.96) 100%);
            border: 1px solid rgba(255,215,0,0.27);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-glass:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(255,215,0,0.15);
        }

        .module-icon {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .module-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--bosnia-yellow);
            margin: 0 0 10px 0;
            font-size: 18px;
            letter-spacing: 0.08em;
        }

        .btn-primary {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 9999px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #001F3F;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            box-shadow: 0 6px 18px rgba(255,215,0,0.45);
            transition: transform 0.15s ease;
        }

        .btn-primary:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <section class="hero">
        <h1 class="hero-title">NACIO</h1>
        <p class="hero-tagline">Gdje smo, nacijo?</p>
        <a href="#" class="btn-primary">Pridruži se zajednici</a>
    </section>

    <div class="modules-grid">
        <div class="card-glass">
            <div class="module-icon">🏠</div>
            <h3 class="module-title">NAŠA POSLA</h3>
            <p>Lokalne vijesti i dešavanja iz tvog komšiluka.</p>
        </div>
        <div class="card-glass">
            <div class="module-icon">💼</div>
            <h3 class="module-title">BIZNIS TAČKA</h3>
            <p>Poveži se sa domaćim privrednicima i prilikama.</p>
        </div>
        <!-- Ovdje ćemo dodati ostalih 8 modula -->
    </div>
</body>
</html>
